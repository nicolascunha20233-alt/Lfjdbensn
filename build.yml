name: Build JoJoStandMod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Localizar projeto e compilar
        shell: bash
        run: |
          if [ -f "JoJoStandMod.csproj" ]; then
            PROJECT="JoJoStandMod.csproj"
          elif [ -f "JoJoStandMod/JoJoStandMod.csproj" ]; then
            PROJECT="JoJoStandMod/JoJoStandMod.csproj"
          else
            echo "Nao encontrei JoJoStandMod.csproj na raiz nem na pasta JoJoStandMod."
            find . -name '*.csproj' -print
            exit 1
          fi
          dotnet build "$PROJECT" -c Release -o "$GITHUB_WORKSPACE/out"

      - name: Disponibilizar DLL compilada
        uses: actions/upload-artifact@v4
        with:
          name: JoJoStandMod
          path: out/JoJoStandMod.dll
          if-no-files-found: error
